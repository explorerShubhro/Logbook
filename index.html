// --- storage.js (localStorage-backed shim matching window.storage API) ---
(function () {
  const PREFIX = 'logbook';
  function fullKey(key, shared) { return PREFIX + ':' + (shared ? 'shared' : 'user') + ':' + key; }
  window.storage = {
    async get(key, shared = false) {
      const raw = window.localStorage.getItem(fullKey(key, shared));
      if (raw === null) throw new Error('Key not found: ' + key);
      return { key, value: raw, shared };
    },
    async set(key, value, shared = false) {
      window.localStorage.setItem(fullKey(key, shared), value);
      return { key, value, shared };
    },
    async delete(key, shared = false) {
      window.localStorage.removeItem(fullKey(key, shared));
      return { key, deleted: true, shared };
    },
    async list(prefix = '', shared = false) {
      const searchPrefix = fullKey(prefix, shared);
      const scopePrefix = PREFIX + ':' + (shared ? 'shared' : 'user') + ':';
      const keys = Object.keys(window.localStorage).filter(k => k.startsWith(searchPrefix)).map(k => k.slice(scopePrefix.length));
      return { keys, prefix, shared };
    },
  };
})();

function subjectOf(id, subjects) {

}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function formatDateHeading(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
}

function dayDiff(aISO, bISO) {
  const a = new Date(aISO + 'T00:00:00');
  const b = new Date(bISO + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}

function computeStreaks(entries) {
  const days = Array.from(new Set(entries.map((e) => e.date))).sort();
  if (days.length === 0) return { current: 0, longest: 0 };
  let longest = 1;
  let run = 1;
  for (let i = 1; i < days.length; i++) {
    if (dayDiff(days[i], days[i - 1]) === 1) {
      run += 1;
    } else {
      run = 1;
    }
    longest = Math.max(longest, run);
  }
  const daySet = new Set(days);
  let current = 0;
  let cursor = todayISO();
  if (!daySet.has(cursor)) {
    const y = new Date(cursor + 'T00:00:00');
    y.setDate(y.getDate() - 1);
    cursor = y.toISOString().slice(0, 10);
  }
  while (daySet.has(cursor)) {
    current += 1;
    const d = new Date(cursor + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    cursor = d.toISOString().slice(0, 10);
  }
  return { current, longest };
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function buildBuckets(range) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const buckets = [];
  if (range === 'weekly') {
    const start = startOfWeek(today);
    for (let i = 7; i >= 0; i--) {
      const wkStart = new Date(start);
      wkStart.setDate(wkStart.getDate() - i * 7);
      const wkEnd = new Date(wkStart);
      wkEnd.setDate(wkEnd.getDate() + 6);
      buckets.push({
        label: wkStart.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
        start: wkStart,
        end: wkEnd,
      });
    }
  } else if (range === 'monthly') {
    for (let i = 5; i >= 0; i--) {
      const m = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const mEnd = new Date(today.getFullYear(), today.getMonth() - i + 1, 0);
      buckets.push({
        label: m.toLocaleDateString(undefined, { month: 'short', year: '2-digit' }),
        start: m,
        end: mEnd,
      });
    }
  } else {
    for (let i = 3; i >= 0; i--) {
      const y = today.getFullYear() - i;
      buckets.push({ label: String(y), start: new Date(y, 0, 1), end: new Date(y, 11, 31, 23, 59, 59) });
    }
  }
  return buckets;
}

function inBucket(dateISO, bucket) {
  const d = new Date(dateISO + 'T00:00:00');
  return d >= bucket.start && d <= bucket.end;
}

function slugify(text, existingIds) {
  let base = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'field';
  let id = base;
  let n = 1;
  while (existingIds.includes(id)) {
    id = `${base}-${n}`;
    n += 1;
  }
  return id;
}

        }
        if (sRes.status === 'fulfilled' && sRes.value && sRes.value.value) {
          const loaded = JSON.parse(sRes.value.value);
          if (Array.isArray(loaded) && loaded.length > 0) setSubjects(loaded);
        }
      } catch (e) {
        // fall back to defaults / empty
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function persistEntries(next) {
    setEntries(next);
    try {
      const result = await window.storage.set(ENTRIES_KEY, JSON.stringify(next), false);
      if (!result) setError('Could not save — try again.');
      else setError('');
    } catch (e) {
      setError('Could not save — try again.');
    }
  }

  async function persistSubjects(next) {
    setSubjects(next);
    try {
      await window.storage.set(SUBJECTS_KEY, JSON.stringify(next), false);
    } catch (e) {
      setError('Could not save fields — try again.');
    }
  }

  async function addEntry() {
    if (!form.notes.trim()) {
      setError('Write at least a line before saving.');
      return;
    }
    setSaving(true);
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      date: form.date,
      subjectId: form.subjectId,
      notes: form.notes.trim(),
      link: form.link.trim(),
      createdAt: new Date().toISOString(),
    };
    await persistEntries([entry, ...entries]);
    setForm({ date: todayISO(), subjectId: form.subjectId, notes: '', link: '' });
    setSaving(false);
  }

  async function deleteEntry(id) {
    await persistEntries(entries.filter((e) => e.id !== id));
  }

  async function clearAll() {
    if (window.confirm('Clear every entry? This cannot be undone.')) {
      await persistEntries([]);
    }
  }

  function exportData() {
    const payload = { exportedAt: new Date().toISOString(), entries, subjects };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `logbook-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function triggerImport() {
    fileInputRef.current?.click();
  }

  async function importData(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.entries) || !Array.isArray(parsed.subjects)) {
        throw new Error('bad shape');
      }
      const replace = window.confirm(
        'Replace current data with this backup? Choose Cancel to merge instead of replace.'
      );
      if (replace) {
        await persistEntries(parsed.entries);
        await persistSubjects(parsed.subjects);
      } else {
        const existingIds = new Set(entries.map((x) => x.id));
        const merged = [...entries, ...parsed.entries.filter((x) => !existingIds.has(x.id))];
        const existingSubjectIds = new Set(subjects.map((x) => x.id));
        const mergedSubjects = [...subjects, ...parsed.subjects.filter((x) => !existingSubjectIds.has(x.id))];
        await persistEntries(merged);
        await persistSubjects(mergedSubjects);
      }
      setError('');
    } catch (err) {
      setError('That file doesn\u2019t look like a logbook backup.');
    } finally {
      e.target.value = '';
    }
  }

  async function addField() {
    const name = newFieldName.trim();
    if (!name) return;
    const id = slugify(name, subjects.map((s) => s.id));
    const usedColors = subjects.map((s) => s.color);
    const color = PALETTE.find((c) => !usedColors.includes(c)) || PALETTE[subjects.length % PALETTE.length];
    await persistSubjects([...subjects, { id, label: name, color }]);
    setNewFieldName('');
  }

  async function updateField(id, patch) {
    await persistSubjects(subjects.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  }

  async function removeField(id) {
    const count = entries.filter((e) => e.subjectId === id).length;
    const msg = count > 0
      ? `This field has ${count} entr${count === 1 ? 'y' : 'ies'}. They'll stay, just marked as "Removed field". Remove it anyway?`
      : 'Remove this field?';
    if (window.confirm(msg)) {
      const next = subjects.filter((s) => s.id !== id);
      await persistSubjects(next);
      if (form.subjectId === id && next.length > 0) {
        setForm((f) => ({ ...f, subjectId: next[0].id }));
      }
      if (filter === id) setFilter('all');
    }
  }

  const { current: streak, longest: longestStreak } = useMemo(() => computeStreaks(entries), [entries]);

  const subjectCounts = useMemo(() => {
    const counts = {};
    subjects.forEach((s) => (counts[s.id] = 0));
    entries.forEach((e) => {
      counts[e.subjectId] = (counts[e.subjectId] || 0) + 1;
    });
    return counts;
  }, [entries, subjects]);

  const maxCount = Math.max(1, ...Object.values(subjectCounts));

  const filtered = useMemo(
    () => (filter === 'all' ? entries : entries.filter((e) => e.subjectId === filter)),
    [entries, filter]
  );

  const grouped = useMemo(() => {
    const map = new Map();
    filtered
      .slice()
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt.localeCompare(a.createdAt)))
      .forEach((e) => {
        if (!map.has(e.date)) map.set(e.date, []);
        map.get(e.date).push(e);
      });
    return Array.from(map.entries());
  }, [filtered]);

  const chartData = useMemo(() => {
    const buckets = buildBuckets(range);
    return buckets.map((b) => {
      const row = { period: b.label };
      let total = 0;
      subjects.forEach((s) => {
        const c = entries.filter((e) => e.subjectId === s.id && inBucket(e.date, b)).length;
        row[s.id] = c;
        total += c;
      });
      row.total = total;
      return row;
    });
  }, [entries, subjects, range]);

  return (
    <div
      className="min-h-screen w-full"
      style={{
        backgroundColor: PAPER,
        backgroundImage: `linear-gradient(${GRID} 1px, transparent 1px), linear-gradient(90deg, ${GRID} 1px, transparent 1px)`,
        backgroundSize: '22px 22px',
        color: INK,
        fontFamily: "'Source Serif 4', Georgia, serif",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap');
        .mono { font-family: 'Space Mono', monospace; }
        ::selection { background: #2B4C7E33; }
      `}</style>

      <div className="max-w-2xl mx-auto px-4 pt-8 pb-16">
        {/* Header */}
        <header className="flex items-start justify-between mb-5">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <BookOpen size={20} strokeWidth={2} style={{ color: '#2B4C7E' }} />
              <h1 className="mono text-2xl tracking-tight" style={{ fontWeight: 700 }}>
                LOGBOOK
              </h1>
            </div>
            <p className="text-sm" style={{ color: MUTED }}>
              A year of physics, mathematics, computation & the world.
            </p>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setManageOpen((v) => !v)}
              className="p-2 rounded-sm"
              style={{ backgroundColor: manageOpen ? INK : CARD, border: `1px solid ${BORDER}`, color: manageOpen ? PAPER : MUTED }}
              title="Manage fields"
            >
              <Settings2 size={16} />
            </button>
            <div
              className="flex items-center gap-1.5 px-3 py-2 rounded-sm mono text-sm"
              style={{ backgroundColor: CARD, border: `1px solid ${BORDER}` }}
              title="Consecutive days logged"
            >
              <Flame size={16} style={{ color: streak > 0 ? '#C69214' : MUTED }} />
              <span style={{ fontWeight: 700 }}>{streak}</span>
              <span style={{ color: MUTED }}>day{streak === 1 ? '' : 's'}</span>
            </div>
          </div>
        </header>

        {loading ? (
          <div className="flex items-center gap-2 py-16 justify-center" style={{ color: MUTED }}>
            <Loader2 size={18} className="animate-spin" />
            <span className="mono text-sm">loading entries…</span>
          </div>
        ) : (
          <>
            {/* Manage fields panel */}
            {manageOpen && (
              <div className="rounded-sm p-4 mb-5" style={{ backgroundColor: CARD, border: `1px solid ${BORDER}` }}>
                <div className="flex items-center justify-between mb-3">
                  <p className="mono text-xs" style={{ color: MUTED, letterSpacing: '0.05em' }}>MANAGE FIELDS</p>
                  <button onClick={() => setManageOpen(false)} style={{ color: MUTED }}><X size={15} /></button>
                </div>
                <div className="space-y-2">
                  {subjects.map((s) => (
                    <div key={s.id} className="flex items-center gap-2">
                      <div className="flex gap-1">
                        {PALETTE.map((c) => (
                          <button
                            key={c}
                            onClick={() => updateField(s.id, { color: c })}
                            className="w-4 h-4 rounded-full shrink-0"
                            style={{
                              backgroundColor: c,
                              outline: s.color === c ? `2px solid ${INK}` : 'none',
                              outlineOffset: '1px',
                            }}
                          />
                        ))}
                      </div>
                      <input
                        value={s.label}
                        onChange={(e) => updateField(s.id, { label: e.target.value })}
                        className="flex-1 min-w-0 text-sm px-2 py-1.5 rounded-sm outline-none"
                        style={{ backgroundColor: PAPER, border: `1px solid ${BORDER}`, color: INK }}
                      />
                      <button onClick={() => removeField(s.id)} style={{ color: '#A8472E' }} title="Remove field">
                        <Trash2 size={14} />
                      </button>
                    </div>
                  ))}
                </div>
                <div className="flex items-center gap-2 mt-3 pt-3" style={{ borderTop: `1px solid ${BORDER}` }}>
                  <input
                    value={newFieldName}
                    onChange={(e) => setNewFieldName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && addField()}
                    placeholder="New field name…"
                    className="flex-1 min-w-0 text-sm px-2 py-1.5 rounded-sm outline-none"
                    style={{ backgroundColor: PAPER, border: `1px solid ${BORDER}`, color: INK }}
                  />
                  <button
                    onClick={addField}
                    className="mono text-xs px-2.5 py-1.5 rounded-sm flex items-center gap-1"
                    style={{ backgroundColor: INK, color: PAPER, fontWeight: 700 }}
                  >
                    <Plus size={13} /> Add
                  </button>
                </div>
              </div>
            )}

            {/* View toggle */}
            <div className="flex gap-1.5 mb-5">
              <button
                onClick={() => setView('journal')}
                className="mono text-xs px-3 py-1.5 rounded-sm flex items-center gap-1.5"
                style={{
                  border: `1px solid ${view === 'journal' ? INK : BORDER}`,
                  backgroundColor: view === 'journal' ? INK : 'transparent',
                  color: view === 'journal' ? PAPER : MUTED,
                }}
              >
                <NotebookPen size={13} /> Journal
              </button>
              <button
                onClick={() => setView('progress')}
                className="mono text-xs px-3 py-1.5 rounded-sm flex items-center gap-1.5"
                style={{
                  border: `1px solid ${view === 'progress' ? INK : BORDER}`,
                  backgroundColor: view === 'progress' ? INK : 'transparent',
                  color: view === 'progress' ? PAPER : MUTED,
                }}
              >
                <BarChart3 size={13} /> Progress
              </button>
            </div>

            {view === 'journal' ? (
              <>
                {/* New entry panel */}
                <div className="rounded-sm p-4 mb-6" style={{ backgroundColor: CARD, border: `1px solid ${BORDER}` }}>
                  <div className="flex flex-wrap gap-2 mb-3">
                    {subjects.map((s) => {
                      const active = form.subjectId === s.id;
                      return (
                        <button
                          key={s.id}
                          onClick={() => setForm((f) => ({ ...f, subjectId: s.id }))}
                          className="mono text-xs px-2.5 py-1.5 rounded-sm transition"
                          style={{
                            border: `1px solid ${active ? s.color : BORDER}`,
                            backgroundColor: active ? s.color : 'transparent',
                            color: active ? '#FAFBF6' : MUTED,
                            fontWeight: active ? 700 : 400,
                          }}
                        >
                          {s.label}
                        </button>
                      );
                    })}
                  </div>

                  <textarea
                    value={form.notes}
                    onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))}
                    placeholder="What did you study today? Key ideas, problems solved, questions still open…"
                    rows={3}
                    className="w-full text-sm p-2.5 rounded-sm resize-none outline-none"
                    style={{ backgroundColor: PAPER, border: `1px solid ${BORDER}`, color: INK, fontFamily: "'Source Serif 4', Georgia, serif" }}
                  />

                  <div className="flex flex-wrap items-center gap-2 mt-2">
                    <div className="flex items-center gap-1.5 flex-1 min-w-[160px]">
                      <Link2 size={14} style={{ color: MUTED }} />
                      <input
                        value={form.link}
                        onChange={(e) => setForm((f) => ({ ...f, link: e.target.value }))}
                        placeholder="Link to the chat/session (optional)"
                        className="w-full text-xs p-2 rounded-sm outline-none"
                        style={{ backgroundColor: PAPER, border: `1px solid ${BORDER}`, color: INK }}
                      />
                    </div>
                    <input
                      type="date"
                      value={form.date}
                      onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))}
                      className="mono text-xs p-2 rounded-sm outline-none"
                      style={{ backgroundColor: PAPER, border: `1px solid ${BORDER}`, color: INK }}
                    />
                    <button
                      onClick={addEntry}
                      disabled={saving}
                      className="mono text-xs px-3 py-2 rounded-sm flex items-center gap-1"
                      style={{ backgroundColor: INK, color: PAPER, fontWeight: 700 }}
                    >
                      {saving ? <Loader2 size={13} className="animate-spin" /> : <Plus size={13} />}
                      Log it
                    </button>
                  </div>
                  {error && <p className="text-xs mt-2" style={{ color: '#A8472E' }}>{error}</p>}
                </div>

                {/* Filter tabs */}
                <div className="flex flex-wrap gap-1.5 mb-5">
                  <button
                    onClick={() => setFilter('all')}
                    className="mono text-xs px-2.5 py-1 rounded-sm"
                    style={{
                      border: `1px solid ${filter === 'all' ? INK : BORDER}`,
                      backgroundColor: filter === 'all' ? INK : 'transparent',
                      color: filter === 'all' ? PAPER : MUTED,
                    }}
                  >
                    All ({entries.length})
                  </button>
                  {subjects.map((s) => (
                    <button
                      key={s.id}
                      onClick={() => setFilter(s.id)}
                      className="mono text-xs px-2.5 py-1 rounded-sm"
                      style={{
                        border: `1px solid ${filter === s.id ? s.color : BORDER}`,
                        backgroundColor: filter === s.id ? s.color : 'transparent',
                        color: filter === s.id ? '#FAFBF6' : MUTED,
                      }}
                    >
                      {s.label} ({subjectCounts[s.id] || 0})
                    </button>
                  ))}
                </div>

                {/* Entries */}
                {grouped.length === 0 ? (
                  <div className="text-center py-14 rounded-sm" style={{ border: `1px dashed ${BORDER}`, color: MUTED }}>
                    <p className="text-sm">
                      {entries.length === 0 ? 'Empty page. Log today\u2019s session above to start the streak.' : 'Nothing under this tab yet.'}
                    </p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {grouped.map(([date, dayEntries]) => (
                      <div key={date}>
                        <div className="flex items-center gap-2 mb-2">
                          <span className="mono text-xs" style={{ color: MUTED }}>{formatDateHeading(date)}</span>
                          <div className="flex-1 h-px" style={{ backgroundColor: BORDER }} />
                        </div>
                        <div className="space-y-2">
                          {dayEntries.map((e) => {
                            const subj = subjectOf(e.subjectId, subjects);
                            return (
                              <div
                                key={e.id}
                                className="rounded-sm p-3 flex gap-3"
                                style={{ backgroundColor: CARD, border: `1px solid ${BORDER}`, borderLeft: `3px solid ${subj.color}` }}
                              >
                                <div className="flex-1 min-w-0">
                                  <span
                                    className="mono text-[10px] px-1.5 py-0.5 rounded-sm inline-block mb-1.5"
                                    style={{ backgroundColor: `${subj.color}22`, color: subj.color, fontWeight: 700 }}
                                  >
                                    {subj.label}
                                  </span>
                                  <p className="text-sm leading-relaxed whitespace-pre-wrap">{e.notes}</p>
                                  {e.link && (
                                    <a href={e.link} target="_blank" rel="noreferrer" className="text-xs mt-1.5 inline-flex items-center gap-1 hover:underline" style={{ color: '#2B4C7E' }}>
                                      <Link2 size={11} /> session link
                                    </a>
                                  )}
                                </div>
                                <button onClick={() => deleteEntry(e.id)} className="self-start opacity-40 hover:opacity-100 transition" style={{ color: '#A8472E' }} title="Delete entry">
                                  <Trash2 size={15} />
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            ) : (
              <>
                {/* Progress view */}
                <div className="rounded-sm p-4 mb-5" style={{ backgroundColor: CARD, border: `1px solid ${BORDER}` }}>
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div className="flex gap-1.5">
                      {[['category', 'Category-wise'], ['total', 'All together']].map(([key, label]) => (
                        <button
                          key={key}
                          onClick={() => setGrouping(key)}
                          className="mono text-[11px] px-2.5 py-1 rounded-sm"
                          style={{
                            border: `1px solid ${grouping === key ? INK : BORDER}`,
                            backgroundColor: grouping === key ? INK : 'transparent',
                            color: grouping === key ? PAPER : MUTED,
                          }}
                        >
                          {label}
                        </button>
                      ))}
                    </div>
                    <div className="flex gap-1.5">
                      {[['weekly', 'Weekly'], ['monthly', 'Monthly'], ['yearly', 'Yearly']].map(([key, label]) => (
                        <button
                          key={key}
                          onClick={() => setRange(key)}
                          className="mono text-[11px] px-2.5 py-1 rounded-sm"
                          style={{
                            border: `1px solid ${range === key ? '#2B4C7E' : BORDER}`,
                            backgroundColor: range === key ? '#2B4C7E' : 'transparent',
                            color: range === key ? '#FAFBF6' : MUTED,
                          }}
                        >
                          {label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {entries.length === 0 ? (
                    <div className="text-center py-14" style={{ color: MUTED }}>
                      <p className="text-sm">No entries yet — nothing to chart.</p>
                    </div>
                  ) : (
                    <ResponsiveContainer width="100%" height={280}>
                      <BarChart data={chartData} margin={{ top: 4, right: 4, left: -20, bottom: 0 }}>
                        <CartesianGrid stroke={GRID} vertical={false} />
                        <XAxis dataKey="period" tick={{ fontSize: 10, fontFamily: 'Space Mono', fill: MUTED }} axisLine={{ stroke: BORDER }} tickLine={false} />
                        <YAxis allowDecimals={false} tick={{ fontSize: 10, fontFamily: 'Space Mono', fill: MUTED }} axisLine={false} tickLine={false} />
                        <Tooltip
                          contentStyle={{ background: CARD, border: `1px solid ${BORDER}`, fontSize: 12, fontFamily: 'Space Mono', borderRadius: 2 }}
                          labelStyle={{ color: INK, fontWeight: 700 }}
                          cursor={{ fill: `${INK}0A` }}
                        />
                        {grouping === 'category' ? (
                          <>
                            <Legend wrapperStyle={{ fontSize: 10, fontFamily: 'Space Mono' }} iconSize={8} />
                            {subjects.map((s) => (
                              <Bar key={s.id} dataKey={s.id} stackId="a" fill={s.color} name={s.label} />
                            ))}
                          </>
                        ) : (
                          <Bar dataKey="total" fill={INK} radius={[2, 2, 0, 0]} name="Entries" />
                        )}
                      </BarChart>
                    </ResponsiveContainer>
                  )}
                </div>

                {/* All-time stats */}
                <div className="rounded-sm p-4" style={{ backgroundColor: CARD, border: `1px solid ${BORDER}` }}>
                  <div className="grid grid-cols-3 gap-3 mb-4 text-center">
                    <div>
                      <p className="mono text-lg" style={{ fontWeight: 700 }}>{entries.length}</p>
                      <p className="mono text-[10px]" style={{ color: MUTED }}>TOTAL LOGS</p>
                    </div>
                    <div>
                      <p className="mono text-lg" style={{ fontWeight: 700, color: '#C69214' }}>{streak}</p>
                      <p className="mono text-[10px]" style={{ color: MUTED }}>CURRENT STREAK</p>
                    </div>
                    <div>
                      <p className="mono text-lg" style={{ fontWeight: 700 }}>{longestStreak}</p>
                      <p className="mono text-[10px]" style={{ color: MUTED }}>LONGEST STREAK</p>
                    </div>
                  </div>
                  <p className="mono text-[10px] mb-2.5" style={{ color: MUTED, letterSpacing: '0.05em' }}>ALL-TIME DISTRIBUTION</p>
                  <div className="space-y-1.5">
                    {subjects.map((s) => (
                      <div key={s.id} className="flex items-center gap-2">
                        <span className="mono text-[10px] w-24 shrink-0 truncate" style={{ color: MUTED }}>{s.label}</span>
                        <div className="flex-1 h-2 rounded-sm overflow-hidden" style={{ backgroundColor: BORDER }}>
                          <div className="h-full" style={{ width: `${((subjectCounts[s.id] || 0) / maxCount) * 100}%`, backgroundColor: s.color }} />
                        </div>
                        <span className="mono text-[10px] w-5 text-right" style={{ color: MUTED }}>{subjectCounts[s.id] || 0}</span>
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center gap-3 mt-4 flex-wrap">
                    <button onClick={exportData} className="mono text-[10px] flex items-center gap-1" style={{ color: '#2B4C7E' }}>
                      <Download size={11} /> export backup
                    </button>
                    <button onClick={triggerImport} className="mono text-[10px] flex items-center gap-1" style={{ color: '#2B4C7E' }}>
                      <Upload size={11} /> import backup
                    </button>
                    <input ref={fileInputRef} type="file" accept="application/json" onChange={importData} className="hidden" />
                    <button onClick={clearAll} className="mono text-[10px]" style={{ color: MUTED, textDecoration: 'underline' }}>
                      clear all entries
                    </button>
                  </div>
                </div>
              </>
            )}
          </>
        )}

        <footer className="mt-10 text-center">
          <p className="mono text-[10px] tracking-wide" style={{ color: MUTED, opacity: 0.6 }}>
            obviously built by a physicist — Shubhro
          </p>
        </footer>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
